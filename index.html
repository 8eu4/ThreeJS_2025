<!DOCTYPE html>
<html lang="en">

<head>
  <title>Three.js Modular App</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    .lil-gui {
      z-index: 10 !important;
      right: 0;
      top: 0;
    }

    #hierarchy-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 240px;
      height: 100vh;
      background: #f0f0f0;
      border-right: 1px solid #ccc;
      z-index: 5;
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
      user-select: none;
    }

    #hierarchy-panel h3 {
      margin: 0 0 10px 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #ccc;
    }

    /* --- CSS HIERARKI (Tidak Berubah) --- */
    .hierarchy-item {
      /* Kontainer untuk content dan child-container */
    }

    .hierarchy-item-content {
      display: flex;
      align-items: center;
      padding: 4px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hierarchy-item-content:hover {
      background: #e0e0e0;
    }

    .hierarchy-item-content.selected {
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    .hierarchy-toggle {
      width: 10px;
      height: 10px;
      margin-right: 4px;
      display: inline-block;
      font-size: 10px;
      flex-shrink: 0;
    }

    .hierarchy-children {
      /* Default-nya tertutup */
      display: none;
    }

    .hierarchy-item.open+.hierarchy-children {
      /* Saat .open, tampilkan child-container */
      display: block;
    }

    /* --- AKHIR CSS --- */


    /* --- (1) TAMBAHAN BARU: Feedback Geser Angka GUI --- */
    /* Target bagian .widget (kotak angka) di dalam .controller.number */
    .lil-gui .controller.number .widget {
      /* Paksa kursor jadi panah kiri-kanan */
      cursor: ew-resize !important;
    }

    /* --- AKHIR TAMBAHAN --- */


    /* --- PERBAIKAN CSS EFEK KEDIP MATA --- */
    /* GAYA BARU: CINEMATIC VIGNETTE BLINK */
      #cinematic-eyelids {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        pointer-events: none; /* Klik tembus */
        
        /* Default: Hitam Pekat (Tertutup) */
        /* background-color: black; */
        
        /* Kita akan memanipulasi properti ini via JS */
        /* Ellipse lebar (150%) tapi tingginya 0% (gepeng/tutup) */
        background-image: radial-gradient(ellipse 150% 0% at center, transparent 30%, black 60%);
      }

    /* --- AKHIR PERBAIKAN CSS --- */
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
  <div id="hierarchy-panel">
    <h3>Scene Hierarchy</h3>
    <div id="hierarchy-list"></div>
  </div>

  <div id="cinematic-eyelids"></div>

  <script async src="https://unpkg.com/es-module-shims@1.10.0"></script>
  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/",
          "three/addons/controls/FlyControls.js": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/controls/FlyControls.js",
          "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.3/build/index.module.js"
        }
      }
    </script>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
